[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "widelog-py"
dynamic = ["version"]
description = "One wide event per operation, not ten scattered log lines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "An Pham", email = "antotis21@gmail.com" }]
keywords = [
  "logging",
  "observability",
  "wide-events",
  "structured-logging",
  "asgi",
  "aws-lambda",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ancs21/widelog-py"
Issues = "https://github.com/ancs21/widelog-py/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  # examples/ are covered by tests/test_examples.py so they can't rot
  "fastapi>=0.110",
  "httpx>=0.27",
]

[tool.hatch.version]
path = "src/widelog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/widelog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # so tests can import examples/

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
